# config.toml 로 복사해 값을 채우세요. (config.toml은 git에 올라가지 않습니다)

# --- 필수 ---
# 일지에 고정으로 들어가는 값. 입력원과 무관하게 항상 필요합니다.
author = "이름"
team = "0조 (교육생 00명)"

# --- 아래는 `/daily-log --discord`로 수집할 때만 필요합니다 ---
# 직접 입력이나 메모 파일(notes/<날짜>.md)로 쓸 때는 그대로 두셔도 됩니다.

# 근무 시간대. 이 구간의 메시지만 수집합니다.
# timezone_offset = 9  # KST
#
# [work_hours]
# start = "09:00"
# end = "18:00"

# 활성 스레드까지 훑으려면 서버 ID를 넣으세요. 비우면 채널 본문만 봅니다.
# guild_id = "000000000000000000"

# 수집 대상 채널. 여러 개 나열할 수 있습니다.
# 채널 ID는 디스코드 설정 > 고급 > 개발자 모드를 켠 뒤 채널 우클릭 > ID 복사.
# [[channels]]
# id = "000000000000000000"
# name = "질문방"
#
# [[channels]]
# id = "000000000000000000"
# name = "공지"

# --- 구글 드라이브 자동 업로드 (선택) ---
# 이 섹션이 없으면 업로드를 건너뛰고 out/ 에 파일만 만듭니다.
# 미리 `brew install rclone && rclone config`로 드라이브 리모트를 만들어 두세요.
#
# remote — rclone config에서 지은 리모트 이름
# folder — 제출 폴더. 드라이브에서 폴더를 열고 주소창을 그대로 붙여넣으면 됩니다.
#          폴더 ID만 넣어도 됩니다.
#
# 아래 세 줄의 # 만 지우고 folder 를 본인 폴더 주소로 바꾸세요.
#
# [drive]
# remote = "gdrive"
# folder = "https://drive.google.com/drive/folders/000000000000000000000000000"

# --- 활동기록부 구글 폼 (선택) ---
# 이 섹션이 없으면 폼 링크 만들기를 건너뜁니다.
# 일지 내용으로 답이 미리 채워진 링크를 만들 뿐, 제출은 하지 않습니다. 제출 버튼은 직접 누르세요.
#
# url       — 폼을 열고 주소창을 그대로 붙여넣으면 됩니다 (.../viewform 형태).
#             문항과 보기 목록은 폼에서 직접 읽어오므로 따로 적지 않아도 됩니다.
# exclusive — 단독으로만 고를 수 있는 보기(예: "특이사항 없음").
#             다른 보기와 같이 체크하면 검사에서 걸립니다. 없으면 줄째 지우세요.
#
# [form]
# url = "https://docs.google.com/forms/d/e/000000000000000000000000000/viewform"
# exclusive = ["특이사항 없음"]
